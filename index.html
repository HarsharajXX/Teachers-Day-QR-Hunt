        --text-sub: #94a3b8;
        --text-muted: #64748b;
        --border-glass: rgba(255, 255, 255, 0.12);
        --font-main: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        -webkit-tap-highlight-color: transparent;
      }

      body {
        background-color: var(--bg-deep);
        color: var(--text-pure);
        font-family: var(--font-main);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        overflow-x: hidden;
        position: relative;
      }

      /* Ambient Neon Glows */
      .ambient-glows {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 0;
        overflow: hidden;
      }

      .glow-orb {
        position: absolute;
        border-radius: 50%;
        filter: blur(110px);
        opacity: 0.8;
      }

      .glow-orb-1 {
        top: -15%;
        left: -15%;
        width: 60vw;
        height: 60vw;
        max-width: 500px;
        max-height: 500px;
        background: radial-gradient(circle, rgba(168, 85, 247, 0.28) 0%, transparent 70%);
      }

      .glow-orb-2 {
        bottom: -15%;
        right: -15%;
        width: 65vw;
        height: 65vw;
        max-width: 560px;
        max-height: 560px;
        background: radial-gradient(circle, rgba(0, 229, 255, 0.22) 0%, transparent 70%);
      }

      /* Particle Canvas for Celebration Burst */
      #fx-canvas {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 999;
      }

      /* Sticky Top Navbar */
      .top-navbar {
        width: 100%;
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        background: rgba(8, 13, 26, 0.65);
        border-bottom: 1px solid var(--border-glass);
        padding: 14px 20px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        position: sticky;
        top: 0;
        z-index: 40;
      }

      .nav-left {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .nav-icon-badge {
        width: 36px;
        height: 36px;
        border-radius: 10px;
        background: linear-gradient(135deg, var(--accent-purple), var(--accent-neon-blue));
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 0 16px rgba(0, 229, 255, 0.4);
        color: #ffffff;
      }

      .nav-text h1 {
        font-size: 1.1rem;
        font-weight: 700;
        letter-spacing: -0.3px;
        background: linear-gradient(to right, #ffffff, #cbd5e1);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      .nav-text p {
        font-size: 0.72rem;
        color: var(--text-sub);
      }

      .live-pill {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 5px 12px;
        border-radius: 9999px;
        background: rgba(0, 229, 255, 0.1);
        border: 1px solid rgba(0, 229, 255, 0.35);
        font-size: 0.72rem;
        font-weight: 600;
        color: var(--accent-neon-blue);
        font-family: var(--font-mono);
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }

      .live-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background-color: var(--accent-neon-blue);
        box-shadow: 0 0 8px var(--accent-neon-blue);
        animation: pulseDot 2s infinite ease-in-out;
      }

      @keyframes pulseDot {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.4; transform: scale(0.75); }

      /* Container */
      .content-wrapper {
        width: 100%;
        max-width: 520px;

        flex-direction: column;
        align-items: center;

      .card-halo-wrap {

      }

      .card-back-glow {
        position: absolute;
        inset: -3px;
        background: linear-gradient(135deg, var(--accent-purple), var(--accent-neon-blue), var(--accent-indigo));
        border-radius: 26px;
        filter: blur(16px);
        opacity: 0.55;
        animation: glowShift 6s ease-in-out infinite alternate;
      }

      @keyframes glowShift {
        0% { opacity: 0.4; filter: blur(14px); }
        100% { opacity: 0.7; filter: blur(20px); }
      }

        width: 100%;

        animation: revealEntrance 0.65s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }

      @keyframes revealEntrance {
        0% {
          opacity: 0;
          transform: translateY(30px) scale(0.92);
        }
        100% {
          opacity: 1;
          transform: translateY(0) scale(1);

        font-size: 0.75rem;
        font-weight: 700;
        letter-spacing: 0.8px;
        text-transform: uppercase;
        margin-bottom: 22px;

      /* Glowing Circular Photo */

      .photo-aura {

        border-radius: 50%;
        background: linear-gradient(135deg, var(--accent-neon-blue), var(--accent-purple), #ec4899, var(--accent-neon-blue));

        animation: rotateAura 5s linear infinite;
        filter: blur(12px);
        opacity: 0.75;
      }

      @keyframes rotateAura {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }

      .photo-ring {

        border-radius: 50%;

        display: flex;
        align-items: center;

        background: rgba(168, 85, 247, 0.25);
        color: #d8b4fe;
        border: 1px solid rgba(168, 85, 247, 0.4);
        display: flex;
        align-items: center;

        font-size: 0.72rem;
        font-weight: 700;
        font-family: var(--font-mono);
        flex-shrink: 0;

      /* Responsive */
      @media (max-width: 440px) {
        .content-wrapper {

        .teacher-name {

        }
        .photo-container {
          width: 150px;
          height: 150px;
        }
      }
    </style>

      /* =========================================================================
         LIGHTWEIGHT CELEBRATION PARTICLE BURST
         Zero dependencies, 60fps HTML5 canvas
         ========================================================================= */
      const fxCanvas = document.getElementById("fx-canvas");
      const ctx = fxCanvas.getContext("2d");
      let animationFrameId = null;

      function resizeFxCanvas() {
        fxCanvas.width = window.innerWidth;
        fxCanvas.height = window.innerHeight;
      }
      window.addEventListener("resize", resizeFxCanvas);
      resizeFxCanvas();

      function triggerCelebrationBurst() {
        resizeFxCanvas();
        cancelAnimationFrame(animationFrameId);

        const colors = ["#00e5ff", "#a855f7", "#ec4899", "#38bdf8", "#facc15", "#ffffff"];
        const particleCount = window.innerWidth < 480 ? 70 : 110;
        const particles = [];

        for (let i = 0; i < particleCount; i++) {
          particles.push({
            x: window.innerWidth * 0.5 + (Math.random() - 0.5) * 60,
            y: window.innerHeight * 0.35 + (Math.random() - 0.5) * 40,
            vx: (Math.random() - 0.5) * 16,
            vy: (Math.random() * -14) - 4,
            size: Math.random() * 8 + 4,
            color: colors[Math.floor(Math.random() * colors.length)],
            rotation: Math.random() * 360,
            rotationSpeed: (Math.random() - 0.5) * 10,
            gravity: 0.4,
            drag: 0.96,
            opacity: 1,
            fadeRate: 0.009 + Math.random() * 0.008
          });
        }

        const start = Date.now();

        function step() {
          ctx.clearRect(0, 0, fxCanvas.width, fxCanvas.height);
          let active = false;

          for (let p of particles) {
            p.vx *= p.drag;
            p.vy += p.gravity;
            p.x += p.vx;
            p.y += p.vy;
            p.rotation += p.rotationSpeed;
            p.opacity -= p.fadeRate;

            if (p.opacity > 0 && p.y < fxCanvas.height + 50) {
              active = true;
              ctx.save();
              ctx.translate(p.x, p.y);
              ctx.rotate((p.rotation * Math.PI) / 180);
              ctx.fillStyle = p.color;
              ctx.globalAlpha = Math.max(0, p.opacity);
              ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.6);
              ctx.restore();
            }
          }

          if (active && Date.now() - start < 3500) {
            animationFrameId = requestAnimationFrame(step);
          } else {
            ctx.clearRect(0, 0, fxCanvas.width, fxCanvas.height);
          }
        }

        step();
      }

      /* =========================================================================
         DOM RENDERING & ROUTING
         ========================================================================= */
      const appRoot = document.getElementById("app-root");

      function escapeHTML(str) {
        return String(str)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      function renderRevealCard(teacher) {

            <div class="reveal-card">

                <div class="photo-ring">
                  <div class="photo-inner">
                    <img 
                      src="${teacher.photo}" 
                      alt="${escapeHTML(teacher.name)}" 
                      class="teacher-photo"
                      onerror="this.style.display='none'; document.getElementById('fallback-${teacher.id}').style.display='flex';"
                    />
                    <div class="avatar-fallback" id="fallback-${teacher.id}" style="display: none;">
                      ${teacher.initials}
                    </div>
                  </div>
                </div>
              </div>

              <h2 class="teacher-name">${escapeHTML(teacher.name)}</h2>
              <div class="teacher-designation">${escapeHTML(teacher.designation)}</div>
              <div class="teacher-dept">${escapeHTML(teacher.department)}</div>

              <div class="specialization-pill">
                <span>💡</span>
                <span>${escapeHTML(teacher.specialization)}</span>
              </div>

              <div class="action-row">
                <button type="button" class="btn btn-secondary" id="btn-burst">
                  <span>🎉 Celebrate</span>
                </button>
                <button type="button" class="btn btn-primary" id="btn-home">
                  <span>🔍 Scan Next</span>
                </button>
              </div>
            </div>
          </div>
        `;

        document.getElementById("btn-burst").addEventListener("click", () => {
          triggerCelebrationBurst();
        });

        document.getElementById("btn-home").addEventListener("click", () => {
          window.history.pushState({}, "", window.location.pathname);
          init();
        });

        // Trigger confetti particle burst instantly upon card reveal
        triggerCelebrationBurst();
      }

      // 2. Clean Landing Screen (when no ID is in URL)
      function renderWelcomeScreen(customMessage = null) {
        appRoot.innerHTML = `
          <div class="welcome-card">
            <div class="scanner-graphic">
              <div class="laser-beam"></div>
              <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#00e5ff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="7" height="7"></rect>
                <rect x="14" y="3" width="7" height="7"></rect>
                <rect x="14" y="14" width="7" height="7"></rect>
                <rect x="3" y="14" width="7" height="7"></rect>
                <path d="M7 17v.01"></path>
                <path d="M17 7v.01"></path>
                <path d="M7 7v.01"></path>
                <path d="M17 17v.01"></path>
              </svg>
            </div>

            <h2 class="welcome-headline">
              ${customMessage ? 'QR Code Not Found' : 'Scan any QR code on the board to start!'}
            </h2>

            <p class="welcome-subtext">
              ${customMessage ? customMessage : 'Point your phone camera at any physical QR code on the CSE Teachers’ Day poster to instantly reveal the hidden faculty mentor.'}
            </p>

            <div class="instruction-box">
              <div class="instruction-step">
                <span class="step-dot">1</span>
                <span>Locate the CSE Teachers' Day poster in the corridor.</span>
              </div>
              <div class="instruction-step">
                <span class="step-dot">2</span>
                <span>Scan any numbered QR code (#1 to #20) using your camera.</span>
              </div>
              <div class="instruction-step">
                <span class="step-dot">3</span>
                <span>Instantly reveals the faculty photo, name, and designation!</span>
              </div>
            </div>
          </div>
        `;
      }

      /* =========================================================================
         INITIALIZATION CONTROLLER
         Pure URL param lookup. No localStorage, no attempt limits, no tracking.
         ========================================================================= */
      function init() {
        const urlParams = new URLSearchParams(window.location.search);
        const rawId = urlParams.get("id");

        if (!rawId) {
          renderWelcomeScreen();
          return;
        }

        const id = parseInt(rawId, 10);
        const teacher = TEACHERS_DATABASE[id];

        if (!teacher) {
          renderWelcomeScreen(`QR Code #${rawId} is not registered in the Teachers' Day database. Try scanning codes #1 to #20 on the board!`);
          return;
        }

        renderRevealCard(teacher);
      }

      // Run on page load
      init();

      // Support browser back/forward history navigation
      window.addEventListener("popstate", () => {
        init();
      });
    </script>
  </body>
</html>
